spring.application.name=coding-platform-backend

# Server port configuration (Render assigns a dynamic port via PORT environment variable)
server.port=${PORT:8080}

# Cross-Origin Resource Sharing (CORS) allowed origins (comma-separated)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# MongoDB configuration placeholder (optional)
spring.data.mongodb.uri=${MONGODB_URI:}

# Execution provider selection ('piston' or 'jdoodle')
execution.provider=${EXECUTION_PROVIDER:piston}

# Piston Sandbox Configuration
execution.piston.base-url=${PISTON_BASE_URL:http://127.0.0.1:2000}
execution.piston.language=${PISTON_LANGUAGE:java}
execution.piston.version=${PISTON_VERSION:15.0.2}
execution.piston.file-name=${PISTON_FILE_NAME:Main}
execution.piston.connect-timeout-ms=${PISTON_CONNECT_TIMEOUT_MS:2000}
execution.piston.read-timeout-ms=${PISTON_READ_TIMEOUT_MS:10000}
execution.piston.run-timeout-ms=${PISTON_RUN_TIMEOUT_MS:6000}

# JDoodle Execution Provider Configuration
jdoodle.base-url=${JDOODLE_BASE_URL:https://api.jdoodle.com}
jdoodle.client-id=${JDOODLE_CLIENT_ID:}
jdoodle.client-secret=${JDOODLE_CLIENT_SECRET:}
jdoodle.default-language=${JDOODLE_DEFAULT_LANGUAGE:java}
jdoodle.default-version-index=${JDOODLE_DEFAULT_VERSION_INDEX:4}
jdoodle.connect-timeout-ms=${JDOODLE_CONNECT_TIMEOUT_MS:5000}
jdoodle.read-timeout-ms=${JDOODLE_READ_TIMEOUT_MS:15000}
