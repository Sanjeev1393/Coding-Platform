name: CI - Lint, Tests & Contract Check

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # ─── Job 1: Frontend Lint, Tests & Build ─────────────────────────────────────
  frontend-verify:
    name: Frontend — Lint, Tests & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run test suite
        run: npm run test:run

      - name: Verify production build
        run: npm run build

  # ─── Job 2: OpenAPI Contract Drift Check ─────────────────────────────────────
  openapi-contract-check:
    name: Backend — OpenAPI Contract Drift Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x backend/mvnw

      - name: Start Spring Boot backend
        working-directory: backend
        # Start in background with nohup so it stays alive; redirect logs to /tmp/backend.log
        run: nohup ./mvnw spring-boot:run > /tmp/backend.log 2>&1 &

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend to start..."
          healthy=false
          for i in {1..60}; do
            if curl -sf http://localhost:8080/actuator/health > /dev/null 2>&1; then
              echo "✅ Backend is healthy (attempt $i)"
              healthy=true
              break
            fi
            echo "  attempt $i/60 — retrying in 2s..."
            sleep 2
          done

          if [ "$healthy" != "true" ]; then
            echo "❌ Backend failed to start within timeout. Showing backend logs:"
            cat /tmp/backend.log || true
            exit 1
          fi

      - name: Generate current OpenAPI spec from running server
        run: |
          curl -sf http://localhost:8080/v3/api-docs > /tmp/raw-spec.json
          python3 -m json.tool --indent 2 /tmp/raw-spec.json > /tmp/openapi-current.json

      - name: Check for contract drift
        run: |
          if ! diff -q docs/openapi.json /tmp/openapi-current.json > /dev/null 2>&1; then
            echo ""
            echo "╔══════════════════════════════════════════════════════════════╗"
            echo "║           ❌  OpenAPI Contract Drift Detected                ║"
            echo "╠══════════════════════════════════════════════════════════════╣"
            echo "║  docs/openapi.json is out of sync with the running API.     ║"
            echo "║                                                              ║"
            echo "║  This means a Controller or DTO was changed but the         ║"
            echo "║  committed spec was not regenerated.                         ║"
            echo "║                                                              ║"
            echo "║  Fix locally and commit before pushing:                     ║"
            echo "║                                                              ║"
            echo "║  Run the generation script and commit the result:           ║"
            echo "║                                                              ║"
            echo "║  Windows (PowerShell):                                       ║"
            echo "║    .\scripts\generate-openapi.ps1                           ║"
            echo "║                                                              ║"
            echo "║  macOS / Linux:                                              ║"
            echo "║    ./scripts/generate-openapi.sh                            ║"
            echo "║                                                              ║"
            echo "╚══════════════════════════════════════════════════════════════╝"
            echo ""
            echo "── Diff (committed vs current) ──────────────────────────────"
            diff docs/openapi.json /tmp/openapi-current.json || true
            echo "─────────────────────────────────────────────────────────────"
            exit 1
          else
            echo "✅ OpenAPI contract is up to date — no drift detected."
          fi
